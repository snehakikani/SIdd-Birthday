<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎂 Blow the Candle | __NAME__'s Birthday</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="birthday-wrap">
    <div style="padding:0 16px;">
      <h1 class="page-title">🎉 Happy Birthday __NAME__! 🎉</h1>
      <p class="birthday-hint">👇 Click the candle to blow it out! 👇</p>
    </div>

    <div class="cake-stage" id="cakeStage">
      <div class="cake-plate"></div>
      <div class="cake-shadow"></div>
      <div class="cake-l cake-l-3"></div>
      <div class="cake-l cake-l-2"></div>
      <div class="cake-l cake-l-1"></div>
      <div class="cake-top"></div>
      <div class="cake-candle" id="candleArea" title="Click to blow! 💨">
        <div class="cake-flame"></div>
        <div class="cake-flame-glow"></div>
      </div>
    </div>

    <p class="wish-text" id="wishText">Make a Wish! ✨</p>

    <a class="btn btn-big" id="birthdayNext" href="photos.html" style="display:none;">
      <span>📸</span><span>NEXT: 15 PHOTO BOOTH</span><span>→</span>
    </a>
  </section>

  <script src="script.js"></script>
</body>
</html>
