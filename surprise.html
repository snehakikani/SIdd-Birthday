<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎆 Final Surprise | __NAME__'s Birthday</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="page-wrap surprise-wrap">
    <h1 class="surprise-title">🎉 HAPPY BIRTHDAY __NAME_UPPER__! 🎉</h1>
    <p class="page-subtitle">Scroll down for all the love 💖</p>

    <!-- ANIMATED CAKE -->
    <div class="surprise-cake-wrap">
      <div class="cake-stage" style="animation: cakeFloat 2.5s ease-in-out infinite;">
        <div class="cake-plate"></div>
        <div class="cake-shadow"></div>
        <div class="cake-l cake-l-3"></div>
        <div class="cake-l cake-l-2"></div>
        <div class="cake-l cake-l-1"></div>
        <div class="cake-top"></div>
        <div class="cake-candle" style="cursor:default;">
          <div class="cake-flame"></div>
          <div class="cake-flame-glow"></div>
        </div>
      </div>
    </div>

    <!-- 15-PHOTO MINI COLLAGE -->
    <h2 class="gradient-text" style="font-size:clamp(1.4rem, 3.5vw, 2rem); margin: 20px 0 16px;">
      📸 15 Moments With You 📸
    </h2>
    <div class="collage-wrap">
      <div class="collage" id="collage"></div>
    </div>

    <!-- FINAL MESSAGE -->
    <h2 class="gradient-text" style="font-size:clamp(1.4rem, 3.5vw, 2rem); margin-top:30px;">
      A Final Message For You 💌
    </h2>
    <div class="final-msg glass">
      <div id="finalMessage"></div>
    </div>

    <!-- GLOWING TEXT -->
    <div style="margin-top: 30px;">
      <div class="awesome-glow">YOU'RE AWESOME, __NAME__! ❤️</div>
    </div>

    <div class="btn-wrap" style="margin-top:40px;">
      <a href="quiz.html" class="btn btn-mint" style="margin: 8px;">
        🧩 Retake the Quiz
      </a>
    </div>

    <!-- EXPERIENCE AGAIN -->
    <div class="again-wrap">
      <a href="index.html" class="btn btn-big">
        🔄 EXPERIENCE AGAIN
      </a>
    </div>

    <div style="text-align:center; margin-top:30px; color:var(--text-light); font-size:0.9rem;">
      Made with 💖 for __NAME__ • 14 October 2025
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
